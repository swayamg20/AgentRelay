name: Autopilot

# Unattended Codex runs toward the goal in autopilot/GOALS.md. Work lands on the
# `autopilot` branch behind a draft PR. Run reports and owner questions are posted
# as GitHub comments and issues that mention the owner, so they arrive by email.
#
# The agent job sets up everything that needs root, starts a model-key proxy under a
# separate user, and drops root before any branch content runs. No branch code runs
# before the agent itself, so nothing can redirect the harness. From then on the job
# is treated as agent-controlled: it holds only a read-only token and restore-only
# cache access, and hands its commits over as a git bundle. The publish job runs on a
# fresh runner, validates the bundle, rewrites commit identity, pushes, and posts. It
# never executes repository code.
on:
  schedule:
    - cron: '30 3 * * *' # 09:00 IST
    - cron: '30 8 * * *' # 14:00 IST
    - cron: '30 14 * * *' # 20:00 IST
  # Also dispatched by autopilot-reply.yml when the owner answers a question.
  workflow_dispatch:
    inputs:
      model:
        description: Primary model deployment
        default: gpt-6.1-sol
      minutes:
        description: Agent time budget in minutes
        default: '220'

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions: {}

env:
  BRANCH: autopilot
  OWNER: ${{ github.repository_owner }}
  NEEDS_YOU_LABEL: 'autopilot:needs-you'
  LOG_ISSUE_TITLE: Autopilot run log
  GIT_NAME: Swayam Gupta
  GIT_EMAIL: 77153230+swayamg20@users.noreply.github.com

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # Restore-only: the cache service refuses saves from this job's token, so nothing
    # the agent controls can plant entries in main's cache scope.
    cache-mode: read
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
      mode: ${{ steps.branch.outputs.mode }}
      base: ${{ steps.branch.outputs.base }}
      remote: ${{ steps.branch.outputs.remote }}
      conflict: ${{ steps.branch.outputs.conflict }}
      bundle: ${{ steps.bundle.outputs.bundle }}
    # Postgres runs natively, not as a service container. A running container adds an
    # nsfs network-namespace entry to /proc/self/mountinfo, which the Node containment
    # parser rejects, failing the Node unit tests.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check status in GOALS.md
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          status="$(grep -m1 -E '^status:' autopilot/GOALS.md | awk '{print $2}')"
          # A scheduled run has nothing to do while a question waits on the owner, and its
          # memory-only commit would move the PR past the report the owner is reading.
          # The owner's reply starts a run immediately; a manual dispatch always runs.
          if [[ "$status" == running && "$EVENT" == schedule ]]; then
            waiting="$(gh issue list --label "$NEEDS_YOU_LABEL" --state open --limit 50 --json number,comments \
              --jq '[.[] | select([.comments[] | select(.author.login == env.OWNER)] | length == 0) | "#\(.number)"] | join(" ")' \
              || true)"
            # Review findings or failing checks on the open PR are work the agent can do
            # without the owner, so they keep the run going.
            feedback="$(bash autopilot/pr-feedback.sh count 2>/dev/null || echo 0)"
            if [[ -n "$waiting" && "$feedback" == 0 ]]; then
              echo "::notice::Waiting on the owner's answer to $waiting; skipping this scheduled run."
              status=waiting
            fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Autopilot status: ${status:-missing}"

      - name: Prepare output directory and harness
        id: prep
        if: steps.gate.outputs.status == 'running'
        run: |
          mkdir -p "$RUNNER_TEMP/autopilot/questions"
          # Root-owned copy of the harness from main. The agent cannot change its own
          # script, instructions, model configuration, or goals, even on its branch.
          h=/opt/autopilot-harness
          sudo install -d -o root -g root -m 755 "$h"
          sudo install -o root -g root -m 644 \
            autopilot/run.sh autopilot/PROMPT.md autopilot/codex-config.toml autopilot/GOALS.md autopilot/pr-feedback.sh "$h/"
          echo "deadline=$(( $(date +%s) + ${{ inputs.minutes || '220' }} * 60 ))" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.gate.outputs.status == 'running'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.status == 'running'
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Postgres, Codex, and the model key proxy
        if: steps.gate.outputs.status == 'running'
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ vars.AZURE_FOUNDRY_BASE_URL }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql postgresql-client
          # Native Postgres on 5433 so the URLs match CI and CONTRIBUTING.md.
          sudo sed -i -E 's/^#?port = [0-9]+/port = 5433/' /etc/postgresql/*/main/postgresql.conf
          sudo systemctl restart postgresql.service
          for _ in $(seq 1 30); do pg_isready -h localhost -p 5433 && break; sleep 1; done
          sudo -u postgres psql -p 5433 -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE agentrelay LOGIN SUPERUSER PASSWORD 'agentrelay-dev'" \
            -c "CREATE DATABASE agentrelay OWNER agentrelay"
          npm install --global @openai/codex@0.154.0

          # The key proxy runs as its own user and receives the key on stdin only, so
          # no process the agent can inspect ever holds it.
          proxy_home=/run/autopilot-keyproxy
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin autopilot-keyproxy
          sudo install -d -o autopilot-keyproxy -g autopilot-keyproxy -m 755 "$proxy_home"
          printf '%s' "$AZURE_FOUNDRY_API_KEY" | sudo -u autopilot-keyproxy \
            env PATH="$PATH" HOME="$proxy_home" CODEX_HOME="$proxy_home" \
            setsid codex responses-api-proxy \
              --upstream-url "${AZURE_FOUNDRY_BASE_URL%/}/responses" \
              --server-info "$proxy_home/info.json" > /dev/null 2>&1 &
          for _ in $(seq 1 60); do [[ -s "$proxy_home/info.json" ]] && break; sleep 0.5; done
          port="$(jq -r .port "$proxy_home/info.json" 2>/dev/null || true)"
          if ! [[ "$port" =~ ^[0-9]+$ ]]; then echo "::error::The model key proxy did not start."; exit 1; fi
          echo "Key proxy on port $port"

      - name: Drop root
        if: steps.gate.outputs.status == 'running'
        run: |
          # Keep this before any step that checks out or runs branch content.
          sudo chmod 600 /var/run/docker.sock 2>/dev/null || true
          sudo sh -c 'rm -f /etc/sudoers.d/*'
          if sudo -n true 2>/dev/null; then
            echo "::error::sudo still works after dropping root; not running the agent."
            exit 1
          fi
          echo "sudo disabled"

      - name: Prepare autopilot branch
        id: branch
        if: steps.gate.outputs.status == 'running'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          # Exact same-repository head lookup; fork PRs from branches with the same name
          # never count. The PR head and the branch tip must agree before continuing.
          pr_head="" remote=""
          for _ in $(seq 1 12); do
            git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
            remote="$(git rev-parse -q --verify "refs/remotes/origin/$BRANCH" || true)"
            pr_head="$(gh api "repos/$GH_REPO/pulls?head=$OWNER:$BRANCH&base=main&state=open&per_page=100" \
              --jq '[.[] | select(.head.repo.full_name == env.GH_REPO)][0].head.sha // empty')"
            [[ -z "$pr_head" || "$pr_head" == "$remote" ]] && break
            sleep 5
          done
          if [[ -n "$pr_head" && "$pr_head" != "$remote" ]]; then
            echo "::error::The autopilot PR head and branch tip disagree; skipping this run."
            exit 1
          fi
          if [[ -n "$pr_head" ]]; then
            # Continue the open PR and bring in anything merged to main since.
            git checkout -B "$BRANCH" "$remote"
            if ! git merge --no-edit refs/remotes/origin/main; then
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=continue" >> "$GITHUB_OUTPUT"
            echo "remote=$remote" >> "$GITHUB_OUTPUT"
          else
            # No open PR: the last batch was merged or discarded. Start fresh from main.
            git checkout -B "$BRANCH" refs/remotes/origin/main
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies from main
        # Fresh mode only: the checkout is main. On a continued branch the agent installs
        # dependencies itself, so no branch code runs before the agent step.
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.mode == 'fresh'
        env:
          RELAY_DATABASE_URL: postgres://agentrelay:agentrelay-dev@localhost:5433/agentrelay
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter relay exec node --import tsx/esm src/db/migrate.ts

      - name: Collect owner replies and open-issue snapshot
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          out="$RUNNER_TEMP/autopilot"
          # The agent cannot call GitHub, so give it a read-only snapshot of the open
          # issues the owner wrote. Issues from anyone else are left out.
          gh issue list --state open --limit 100 --json number,title,labels,author,body \
            | jq -r --arg owner "$OWNER" '.[]
              | select(.author.login == $owner)
              | select([.labels[].name] | index("autopilot") | not)
              | "### #\(.number) \(.title)\n\nLabels: \([.labels[].name] | join(", "))\n\n\(.body[0:6000])\n"' \
            > "$out/issues.md"
          echo "Issue snapshot: $(grep -c '^### #' "$out/issues.md" || true) issues"
          # Only the owner's comments reach the agent. The repository is public.
          gh issue list --label "$NEEDS_YOU_LABEL" --state open --limit 30 \
            --json number,title,body,comments \
            | jq -r --arg owner "$OWNER" '.[] |
              "### Issue #\(.number): \(.title)\n\n\(.body)\n\n" +
              ([.comments[] | select(.author.login == $owner) |
                "**Owner reply (\(.createdAt)):**\n\n\(.body)\n"] | join("\n")) + "\n"' \
            > "$out/inbox.md"
          # Unresolved review findings and failing checks on the open PR, so the agent
          # can fix what blocks the merge. Only the owner's and CodeQL's threads count.
          bash /opt/autopilot-harness/pr-feedback.sh report > "$out/pr-feedback.md" || : > "$out/pr-feedback.md"

      - name: Run agent
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.conflict != 'true'
        continue-on-error: true
        # Literal values and an absolute shell, so nothing written to GITHUB_ENV or
        # GITHUB_PATH earlier can point the agent at another harness or model endpoint.
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        env:
          AUTOPILOT_HARNESS: /opt/autopilot-harness
          AUTOPILOT_OUT: ${{ runner.temp }}/autopilot
          AUTOPILOT_DEADLINE: ${{ steps.prep.outputs.deadline }}
          AUTOPILOT_MODEL: ${{ inputs.model || 'gpt-6.1-sol' }}
          AUTOPILOT_FALLBACK_MODEL: FW-GLM-5.3
          AUTOPILOT_RUN_ID: ${{ github.run_id }}
          AUTOPILOT_MODE: ${{ steps.branch.outputs.mode }}
        # No database variables here: they switch relay unit tests to parallel
        # database runs. PROMPT.md gives the agent the integration command with them.
        run: |
          port="$(jq -r .port /run/autopilot-keyproxy/info.json)"
          [[ "$port" =~ ^[0-9]+$ ]] || { echo "::error::Key proxy port unavailable"; exit 1; }
          AUTOPILOT_MODEL_URL="http://127.0.0.1:$port/v1" /usr/bin/bash "$AUTOPILOT_HARNESS/run.sh"

      - name: Save memory and discard leftovers
        id: tidy
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.conflict != 'true'
        env:
          BASE: ${{ steps.branch.outputs.base }}
          AUTOPILOT_OUT: ${{ runner.temp }}/autopilot
        run: |
          # Unstage everything and drop merge or cherry-pick state, so only the memory
          # files can be committed here; the rest is discarded below.
          git merge --abort 2>/dev/null || true
          git cherry-pick --abort 2>/dev/null || true
          git reset -q
          if [[ -n "$(git status --porcelain -- autopilot/STATE.md autopilot/JOURNAL.md)" ]]; then
            git add autopilot/STATE.md autopilot/JOURNAL.md
            git commit -m "chore(autopilot): update run memory"
          fi
          leftovers="$(git status --porcelain)"
          if [[ -n "$leftovers" ]]; then
            { echo '### Discarded uncommitted changes'; echo '```'; sed -n '1,50p' <<<"$leftovers"; echo '```'; } >> "$AUTOPILOT_OUT/notes.md"
            git reset -q --hard HEAD && git clean -fdq
          fi
          if [[ "$(git rev-parse HEAD)" != "$BASE" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle new commits
        id: bundle
        if: steps.tidy.outputs.changed == 'true'
        env:
          REMOTE: ${{ steps.branch.outputs.remote }}
          AUTOPILOT_OUT: ${{ runner.temp }}/autopilot
        run: |
          # Everything already on the remote is excluded; publish verifies the rest.
          excludes=(refs/remotes/origin/main)
          if [[ -n "$REMOTE" ]]; then excludes+=("$REMOTE"); fi
          git bundle create "$AUTOPILOT_OUT/branch.bundle" HEAD --not "${excludes[@]}"
          echo "bundle=true" >> "$GITHUB_OUTPUT"

      - name: Verify
        if: steps.tidy.outputs.changed == 'true'
        timeout-minutes: 30
        continue-on-error: true
        env:
          AUTOPILOT_OUT: ${{ runner.temp }}/autopilot
        run: |
          # A quick pre-push signal. The PR's own CI is the merge gate.
          # Unit tests use the CONTRIBUTING.md command: `pnpm -r test` also runs the e2e
          # workspace, which needs a live relay. Only the integration command gets the
          # database variables, matching the CI unit and relay-integration jobs.
          : > "$AUTOPILOT_OUT/verify.md"
          for cmd in "pnpm install --frozen-lockfile" "pnpm lint" "pnpm -r typecheck" "pnpm -r build" \
            "pnpm --filter @agentrelay/protocol --filter relay --filter agentrelay-mcp --filter agentrelay-node test" \
            "env RELAY_TEST_DATABASE_URL=postgres://agentrelay:agentrelay-dev@localhost:5433/agentrelay RELAY_TEST_TRUNCATE_VIA_PSQL=1 pnpm --filter relay test:integration"; do
            if timeout -k 1m 10m $cmd > "$AUTOPILOT_OUT/verify.log" 2>&1; then
              echo "- \`$cmd\`: pass" >> "$AUTOPILOT_OUT/verify.md"
            else
              cat "$AUTOPILOT_OUT/verify.log"
              {
                echo "- \`$cmd\`: FAIL"
                tail -n 40 "$AUTOPILOT_OUT/verify.log" | sed 's/^/    /'
              } >> "$AUTOPILOT_OUT/verify.md"
            fi
          done

      - name: Hand results to the publish job
        if: always() && steps.gate.outputs.status == 'running'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autopilot-out
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/autopilot
            !${{ runner.temp }}/autopilot/codex-home

  publish:
    needs: agent
    # Not on cancel: cancelling a run means nothing from it is published.
    if: ${{ !cancelled() && needs.agent.outputs.status == 'running' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    cache-mode: none
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MODE: ${{ needs.agent.outputs.mode }}
      BASE: ${{ needs.agent.outputs.base }}
      REMOTE: ${{ needs.agent.outputs.remote }}
      CONFLICT: ${{ needs.agent.outputs.conflict }}
      HAS_BUNDLE: ${{ needs.agent.outputs.bundle }}
      AGENT_RESULT: ${{ needs.agent.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    # Everything from the agent job is untrusted. This job runs no repository code, and
    # its own notes live outside the downloaded artifact.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: autopilot-out
          path: ${{ runner.temp }}/autopilot

      - name: Validate, rewrite, and push the agent's commits
        id: publish
        if: env.HAS_BUNDLE == 'true'
        run: |
          out="$RUNNER_TEMP/autopilot"
          mkdir -p "$out" "$RUNNER_TEMP/publish"
          notes="$RUNNER_TEMP/publish/notes.md"
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          reject() {
            printf '**Not published.** %s\n\n' "$1" >> "$notes"
            echo "::error::$1"
            exit 0
          }
          open_pr() {
            gh api "repos/$GH_REPO/pulls?head=$OWNER:$BRANCH&base=main&state=open&per_page=100" \
              --jq '[.[] | select(.head.repo.full_name == env.GH_REPO)][0].number // empty'
          }
          # Captured before anything from the bundle is fetched; later checks use SHAs
          # and fully qualified refs only.
          git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          current="$(git rev-parse -q --verify "refs/remotes/origin/$BRANCH" || true)"

          heads="$(git bundle list-heads "$out/branch.bundle" 2>/dev/null | awk '{print $2}')" \
            || reject "The commit bundle could not be read."
          [[ "$heads" == "HEAD" ]] || reject "The commit bundle names refs other than HEAD."
          git bundle verify -q "$out/branch.bundle" || reject "The commit bundle did not verify."
          git fetch -q --no-tags "$out/branch.bundle" "HEAD:refs/autopilot/candidate" || reject "The commit bundle could not be fetched."
          candidate="$(git rev-parse refs/autopilot/candidate)"

          # BASE was recorded before the agent ran: main's tip, or the open PR's head
          # with main merged in. The agent's commits must sit on top of it.
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || reject "The run's base commit is missing."
          git merge-base --is-ancestor "$BASE" "$candidate" || reject "The agent's commits do not build on the run's base commit."
          if [[ "$MODE" == continue ]]; then
            if [[ "$BASE" != "$REMOTE" ]] && ! git merge-base --is-ancestor "$BASE" "$main_sha"; then
              read -r _ p1 p2 extra < <(git rev-list --parents -n1 "$BASE")
              if [[ -n "$extra" || "$p1" != "$REMOTE" || -z "$p2" ]] || ! git merge-base --is-ancestor "$p2" "$main_sha"; then
                reject "The run's base is not a merge of main into the PR head."
              fi
            fi
          else
            git merge-base --is-ancestor "$BASE" "$main_sha" || reject "The run's base is not on main."
          fi
          [[ -z "$(git rev-list --merges "$BASE..$candidate")" ]] || reject "The agent created merge commits."
          # Additions, edits, deletions, and moves under .github/ are all refused.
          git diff --quiet --no-renames "$BASE" "$candidate" -- .github \
            || reject "The agent changed files under .github/, which autopilot never publishes."

          # Closing the PR discards its work, including work that was running when it
          # closed. The PR is queried before main is refetched, so a merge that lands in
          # between still shows up as merged rather than closed.
          if [[ "$MODE" == continue ]]; then
            pr="$(open_pr)" || reject "Could not check whether the autopilot PR is still open."
            git fetch -q origin "+refs/heads/main:refs/remotes/origin/main" || reject "Could not fetch main."
            main_sha="$(git rev-parse refs/remotes/origin/main)"
            if [[ -z "$pr" ]] && ! git merge-base --is-ancestor "$REMOTE" "$main_sha"; then
              reject "The autopilot PR was closed during this run, so its work stays discarded. The next run starts fresh from main."
            fi
          else
            pr="$(open_pr)" || reject "Could not check for an open autopilot PR."
            [[ -z "$pr" ]] || reject "An autopilot PR (#$pr) opened during this run; this run's commits were not published over it."
          fi

          # Owner identity and no AI attribution on this run's commits only.
          git checkout -q -B "$BRANCH" "$candidate"
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --env-filter '
              export GIT_AUTHOR_NAME="$GIT_NAME" GIT_COMMITTER_NAME="$GIT_NAME"
              export GIT_AUTHOR_EMAIL="$GIT_EMAIL" GIT_COMMITTER_EMAIL="$GIT_EMAIL"' \
            --msg-filter 'grep -viE "^(co-authored-by:|.*generated (with|by) .*(claude|codex|gpt|openai|anthropic|ai))" || true' \
            "$BASE..HEAD" >/dev/null || reject "Rewriting commit identity failed; nothing was pushed."

          # If the branch moved during the run (for example a reply merge brought main
          # in), build on top of it instead of discarding either side.
          if [[ "$MODE" == continue && -n "$current" && "$current" != "$REMOTE" ]]; then
            git merge-base --is-ancestor "$REMOTE" "$current" \
              || reject "The autopilot branch was rewritten during the run; this run's commits were not published."
            git merge --no-edit "$current" || { git merge --abort; reject "The autopilot branch moved during the run and merging it conflicts."; }
          fi

          git -c core.hooksPath=/dev/null push -q --force-with-lease="refs/heads/$BRANCH:$current" \
            "https://x-access-token:${GH_TOKEN}@github.com/$GH_REPO.git" "HEAD:refs/heads/$BRANCH" \
            || reject "Pushing to \`$BRANCH\` failed; it changed while this run was publishing. The commits are kept in the autopilot-out artifact of $RUN_URL for 7 days."
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Update the draft PR and approve its CI
        id: pr
        if: steps.publish.outputs.published == 'true'
        run: |
          out="$RUNNER_TEMP/autopilot"
          notes="$RUNNER_TEMP/publish/notes.md"
          # The agent describes the whole branch in pr.md: a title line, then the body.
          default_title="chore(autopilot): scheduled autopilot work"
          title=""
          body="$RUNNER_TEMP/publish/pr-body.md"
          printf '## Summary\n\nWork from scheduled autopilot runs toward the goal in `autopilot/GOALS.md`. Per-run detail is in `autopilot/JOURNAL.md`.\n' > "$body"
          if [[ -s "$out/pr.md" ]]; then
            title="$(head -n1 "$out/pr.md" | sed -E 's/^#+ *//; s/^[[:space:]]+//; s/[[:space:]]+$//' | cut -c1-120)"
            tail -n +2 "$out/pr.md" | head -c 60000 \
              | sed -E 's/[Hh][Ee][Aa][Dd][[:space:]]*[Cc][Oo][Mm][Mm][Ii][Tt]/head-commit/g' \
              | grep -viE '^(co-authored-by:|.*generated (with|by) .*(claude|codex|gpt|openai|anthropic|ai))' \
              > "$body" || true
            [[ -s "$body" ]] || printf '## Summary\n\nSee `autopilot/JOURNAL.md`.\n' > "$body"
          fi
          pr="$(gh api "repos/$GH_REPO/pulls?head=$OWNER:$BRANCH&base=main&state=open&per_page=100" \
            --jq '[.[] | select(.head.repo.full_name == env.GH_REPO)][0].number // empty')"
          if [[ -z "$pr" ]]; then
            if [[ "$MODE" == continue ]] && ! git merge-base --is-ancestor "$REMOTE" refs/remotes/origin/main; then
              # Closed between the publish check and the push: do not reopen it.
              printf '**The autopilot PR was closed while this run published, so no PR was reopened.** The next run starts fresh from main.\n\n' >> "$notes"
              exit 0
            fi
            gh pr create --draft --base main --head "$BRANCH" --title "${title:-$default_title}" --body-file "$body"
          elif [[ -n "$title" ]]; then
            gh pr edit "$pr" --title "$title" --body-file "$body"
          fi

          # CI on a PR opened by github-actions waits for approval, and main only counts
          # checks from the PR's own CI. Approve only this branch's pending CI runs, so a
          # fork PR pointed at the same commit is never approved along with it.
          head="$(git rev-parse HEAD)"
          ids=""
          for _ in $(seq 1 24); do
            ids="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$head&status=action_required&event=pull_request" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .head_repository.full_name == env.GH_REPO and .head_branch == env.BRANCH) | .id' \
              || true)"
            [[ -n "$ids" ]] && break
            sleep 5
          done
          if [[ -z "$ids" ]]; then
            printf '**CI not approved yet.** No pending CI run appeared for %s; a `merge` reply approves it.\n\n' "${head:0:7}" >> "$notes"
          fi
          for id in $ids; do
            if gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null; then
              echo "Approved pending CI run $id"
            else
              printf '**CI not approved yet.** Could not approve CI run %s; a `merge` reply retries.\n\n' "$id" >> "$notes"
            fi
          done

      - name: Open owner questions, close resolved ones, post run report
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
        run: |
          gh label create "$NEEDS_YOU_LABEL" --color B60205 --description "Autopilot is waiting on the owner" --force || true
          gh label create autopilot --color 5319E7 --description "Autopilot runs" --force || true
          out="$RUNNER_TEMP/autopilot"
          notes="$RUNNER_TEMP/publish/notes.md"
          mkdir -p "$out/questions" "$RUNNER_TEMP/publish"

          # Agent-controlled text (including commit subjects and file names) is shown
          # only as literal, size-bounded, fenced text that cannot hide or impersonate
          # the trusted sections, and cannot contain the head-commit marker.
          neutralize() { sed -E 's/[Hh][Ee][Aa][Dd][[:space:]]*[Cc][Oo][Mm][Mm][Ii][Tt]/head-commit/g'; }
          literal() {
            local text n fence
            text="$(head -c "$1" | neutralize)"
            n="$( { grep -oE '`+' <<<"$text" || true; } | awk '{ if (length($0) > m) m = length($0) } END { print m + 1 }')"
            ((n < 3)) && n=3
            fence="$(printf '%*s' "$n" '' | tr ' ' '`')"
            printf '%s\n%s\n%s\n' "$fence" "$text" "$fence"
          }

          opened=""
          if [[ "$CONFLICT" == "true" ]]; then
            conflict_title="Autopilot: Merging main into the autopilot branch conflicts"
            existing="$(gh issue list --label "$NEEDS_YOU_LABEL" --state open --limit 100 --json number,title,url \
              | jq -r --arg t "$conflict_title" 'map(select(.title == $t)) | .[0] // empty | "\(.number) \(.url)"' || true)"
            if [[ -n "$existing" ]]; then
              read -r n url <<<"$existing"
              gh issue comment "$n" --body "Still conflicting with main as of $RUN_URL. Runs are skipped until it is resolved." || true
              opened+="- $url (still open)"$'\n'
            else
              url="$(gh issue create --label "$NEEDS_YOU_LABEL" --label autopilot --title "$conflict_title" \
                --body "@$OWNER The open autopilot PR conflicts with main. Resolve the conflicts on the \`$BRANCH\` branch, or close the PR to discard it. Runs are skipped until then. Run: $RUN_URL" || true)"
              [[ -n "$url" ]] && opened+="- $url"$'\n'
            fi
          fi

          max_q=5 asked=0 skipped=0
          for q in "$out"/questions/*.md; do
            [[ -f "$q" ]] || continue
            if ((asked >= max_q)); then skipped=$((skipped + 1)); continue; fi
            asked=$((asked + 1))
            title="$(head -n1 "$q" | sed 's/^#* *//' | cut -c1-100)"
            [[ -n "$title" ]] || title="Question from the autopilot"
            body="$(printf '@%s\n\n%s\n\n---\nReply here. A reply from @%s starts a run immediately; comments from anyone else are ignored. Run: %s\n' \
              "$OWNER" "$(tail -n +2 "$q" | head -c 20000 | neutralize)" "$OWNER" "$RUN_URL")"
            if url="$(gh issue create --label "$NEEDS_YOU_LABEL" --label autopilot --title "Autopilot: $title" --body "$body")"; then
              opened+="- $url"$'\n'
            else
              echo "::warning::Could not open question $(basename "$q")"
            fi
          done
          ((skipped == 0)) || opened+="- $skipped more questions were not opened; see the autopilot-out artifact."$'\n'

          if [[ -s "$out/resolved.txt" ]]; then
            sed -nE 's/^#?([0-9]+).*/\1/p' "$out/resolved.txt" | sort -u | head -n 20 | while read -r n; do
              if gh issue view "$n" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx "$NEEDS_YOU_LABEL"; then
                gh issue close "$n" --comment "Resolved in autopilot run $RUN_URL" || echo "::warning::Could not close #$n"
              fi
            done || true
          fi

          pr_json="$(gh api "repos/$GH_REPO/pulls?head=$OWNER:$BRANCH&base=main&state=open&per_page=100" \
            --jq '[.[] | select(.head.repo.full_name == env.GH_REPO)][0] // empty' || true)"

          # Trusted sections first, agent text after, head marker last.
          {
            echo "@$OWNER autopilot run finished: $RUN_URL"
            echo
            if [[ "$AGENT_RESULT" != "success" ]]; then
              echo "**The agent job ended with: $AGENT_RESULT.** See the run for details."; echo
            fi
            if [[ "$HAS_BUNDLE" == "true" && "$PUBLISHED" != "true" ]] && ! [[ -s "$notes" ]]; then
              echo "**Not published.** The publish step ended with: $PUBLISH_OUTCOME. The commits are only in the autopilot-out artifact of the run (kept 7 days)."; echo
            fi
            if [[ "$PUBLISHED" == "true" && "$PR_OUTCOME" != "success" ]]; then
              echo "**The commits were pushed, but updating the PR ended with: $PR_OUTCOME.**"; echo
            fi
            [[ -s "$notes" ]] && { cat "$notes"; echo; }
            if [[ "$PUBLISHED" == "true" ]]; then
              echo "**Commits pushed**"
              # This run's own commits only, not ones brought in from main.
              git log --no-merges --format='%h %s' HEAD --not "$BASE" refs/remotes/origin/main | head -n 50 | cut -c1-120 | literal 8000
            fi
            if [[ -n "$pr_json" ]]; then
              pr_head="$(jq -r .head.sha <<<"$pr_json")"
              git fetch -q origin "$pr_head" 2>/dev/null || true
              echo "**Files changed vs main** (from git)"
              git diff --name-status --no-renames "refs/remotes/origin/main...$pr_head" 2>/dev/null | head -n 200 | literal 12000
              echo "**Review:** $(jq -r .html_url <<<"$pr_json")"
              echo
            fi
            [[ -n "$opened" ]] && { echo "**Questions for you**"; echo "$opened"; }
            true
          } > "$RUNNER_TEMP/publish/report-head.md"
          {
            echo "**Sessions** (from the agent job)"
            literal 4000 < "$out/sessions.log" 2>/dev/null || echo "none"
            if [[ -s "$out/verify.md" ]]; then echo "**Agent job checks** (from the agent job)"; literal 8000 < "$out/verify.md"; fi
            if [[ -s "$out/summary.md" ]]; then echo "**Agent summary** (written by the agent)"; literal 20000 < "$out/summary.md"; fi
            if [[ -s "$out/notes.md" ]]; then echo "**Agent notes** (written by the agent)"; literal 8000 < "$out/notes.md"; fi
          } > "$RUNNER_TEMP/publish/report-agent.md"
          : > "$RUNNER_TEMP/publish/report-tail.md"
          if [[ -n "$pr_json" ]]; then
            {
              echo
              # Must stay the last head-commit line: autopilot-merge.yml binds a reply to it.
              echo "Head commit: \`$(jq -r .head.sha <<<"$pr_json")\`"
              echo
              echo "Reply \`merge\` to this email to merge exactly that commit into main once its checks pass."
            } > "$RUNNER_TEMP/publish/report-tail.md"
          fi
          # GitHub comments are capped at 65,536 characters; the agent section yields.
          budget=$((60000 - $(wc -c < "$RUNNER_TEMP/publish/report-head.md") - $(wc -c < "$RUNNER_TEMP/publish/report-tail.md")))
          {
            cat "$RUNNER_TEMP/publish/report-head.md"
            if ((budget > 0)); then head -c "$budget" "$RUNNER_TEMP/publish/report-agent.md"; echo; fi
            cat "$RUNNER_TEMP/publish/report-tail.md"
          } > "$RUNNER_TEMP/publish/report.md"

          log_issue="$(gh issue list --label autopilot --state open --json number,title \
            | jq -r --arg t "$LOG_ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          if [[ -z "$log_issue" ]]; then
            log_issue="$(gh issue create --label autopilot --title "$LOG_ISSUE_TITLE" \
              --body "One comment per autopilot run. Reply \`merge\` to a run's email to merge its PR. Pause runs by setting \`status: paused\` in \`autopilot/GOALS.md\` on main.")"
          fi
          gh issue comment "$log_issue" --body-file "$RUNNER_TEMP/publish/report.md"
