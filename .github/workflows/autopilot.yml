name: Autopilot

# Unattended Codex runs toward the goal in autopilot/GOALS.md. Work lands on the
# `autopilot` branch behind a draft PR. Run reports and owner questions are posted
# as GitHub comments and issues that mention the owner, so they arrive by email.
#
# The agent job is treated as agent-controlled from the moment branch content is
# checked out. Before that it sets up everything that needs root, starts a model-key
# proxy under a separate user, and drops root. It holds only a read-only token and
# restore-only cache access, and hands its commits over as a git bundle. The publish
# job runs on a fresh runner, validates the bundle, rewrites commit identity, pushes,
# and posts. It never executes repository code.
on:
  schedule:
    - cron: '30 3 * * *' # 09:00 IST
    - cron: '30 8 * * *' # 14:00 IST
    - cron: '30 14 * * *' # 20:00 IST
  # Also dispatched by autopilot-reply.yml when the owner answers a question.
  workflow_dispatch:
    inputs:
      model:
        description: Primary model deployment
        default: gpt-6.1-sol
      minutes:
        description: Agent time budget in minutes
        default: '220'

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions: {}

env:
  BRANCH: autopilot
  OWNER: ${{ github.repository_owner }}
  NEEDS_YOU_LABEL: 'autopilot:needs-you'
  LOG_ISSUE_TITLE: Autopilot run log
  GIT_NAME: Swayam Gupta
  GIT_EMAIL: 77153230+swayamg20@users.noreply.github.com

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    # Restore-only: the cache service refuses saves from this job's token, so nothing
    # the agent controls can plant entries in main's cache scope.
    cache-mode: read
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      status: ${{ steps.gate.outputs.status }}
      mode: ${{ steps.branch.outputs.mode }}
      base: ${{ steps.branch.outputs.base }}
      remote: ${{ steps.branch.outputs.remote }}
      conflict: ${{ steps.branch.outputs.conflict }}
      bundle: ${{ steps.bundle.outputs.bundle }}
    # Postgres runs natively, not as a service container. A running container adds an
    # nsfs network-namespace entry to /proc/self/mountinfo, which the Node containment
    # parser rejects, failing the Node unit tests.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check status in GOALS.md
        id: gate
        run: |
          status="$(grep -m1 -E '^status:' autopilot/GOALS.md | awk '{print $2}')"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Autopilot status: ${status:-missing}"

      - name: Prepare output directory and harness
        if: steps.gate.outputs.status == 'running'
        run: |
          out="$RUNNER_TEMP/autopilot"
          mkdir -p "$out/questions"
          # Root-owned copy of the harness from main. The agent cannot change its own
          # script, instructions, model configuration, or goals, even on its branch.
          h=/opt/autopilot-harness
          sudo install -d -o root -g root -m 755 "$h"
          sudo install -o root -g root -m 644 \
            autopilot/run.sh autopilot/PROMPT.md autopilot/codex-config.toml autopilot/GOALS.md "$h/"
          {
            echo "AUTOPILOT_OUT=$out"
            echo "AUTOPILOT_HARNESS=$h"
            echo "AUTOPILOT_DEADLINE=$(( $(date +%s) + ${{ inputs.minutes || '220' }} * 60 ))"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.gate.outputs.status == 'running'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.gate.outputs.status == 'running'
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Postgres, Codex, and the model key proxy
        if: steps.gate.outputs.status == 'running'
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ vars.AZURE_FOUNDRY_BASE_URL }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql postgresql-client
          # Native Postgres on 5433 so the URLs match CI and CONTRIBUTING.md.
          sudo sed -i -E 's/^#?port = [0-9]+/port = 5433/' /etc/postgresql/*/main/postgresql.conf
          sudo systemctl restart postgresql.service
          for _ in $(seq 1 30); do pg_isready -h localhost -p 5433 && break; sleep 1; done
          sudo -u postgres psql -p 5433 -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE agentrelay LOGIN SUPERUSER PASSWORD 'agentrelay-dev'" \
            -c "CREATE DATABASE agentrelay OWNER agentrelay"
          npm install --global @openai/codex@0.154.0

          # The key proxy runs as its own user and receives the key on stdin only, so
          # no process the agent can inspect ever holds it.
          proxy_home=/run/autopilot-keyproxy
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin autopilot-keyproxy
          sudo install -d -o autopilot-keyproxy -g autopilot-keyproxy -m 755 "$proxy_home"
          printf '%s' "$AZURE_FOUNDRY_API_KEY" | sudo -u autopilot-keyproxy \
            env PATH="$PATH" HOME="$proxy_home" CODEX_HOME="$proxy_home" \
            setsid codex responses-api-proxy \
              --upstream-url "${AZURE_FOUNDRY_BASE_URL%/}/responses" \
              --server-info "$proxy_home/info.json" > /dev/null 2>&1 &
          for _ in $(seq 1 60); do [[ -s "$proxy_home/info.json" ]] && break; sleep 0.5; done
          port="$(jq -r .port "$proxy_home/info.json" 2>/dev/null || true)"
          if ! [[ "$port" =~ ^[0-9]+$ ]]; then echo "::error::The model key proxy did not start."; exit 1; fi
          echo "AUTOPILOT_MODEL_URL=http://127.0.0.1:$port/v1" >> "$GITHUB_ENV"

      - name: Drop root
        if: steps.gate.outputs.status == 'running'
        run: |
          # Keep this before any step that checks out or runs branch content: the
          # agent's earlier commits (install scripts, migrations) run after it.
          sudo chmod 600 /var/run/docker.sock 2>/dev/null || true
          sudo sh -c 'rm -f /etc/sudoers.d/*'
          if sudo -n true 2>/dev/null; then
            echo "::error::sudo still works after dropping root; not running the agent."
            exit 1
          fi
          echo "sudo disabled"

      - name: Prepare autopilot branch
        id: branch
        if: steps.gate.outputs.status == 'running'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          remote="$(git rev-parse -q --verify "origin/$BRANCH" || true)"
          # Only a same-repository PR whose head is the branch tip counts; a fork branch
          # with the same name never does.
          pr_head="$(gh pr list --head "$BRANCH" --base main --state open --json isCrossRepository,headRefOid \
            --jq '[.[] | select(.isCrossRepository == false)][0].headRefOid // empty')"
          if [[ -n "$pr_head" && "$pr_head" == "$remote" ]]; then
            # Continue the open PR and bring in anything merged to main since.
            git checkout -B "$BRANCH" "$remote"
            if ! git merge --no-edit origin/main; then
              git merge --abort
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=continue" >> "$GITHUB_OUTPUT"
            echo "remote=$remote" >> "$GITHUB_OUTPUT"
          else
            # No open PR: the last batch was merged or discarded. Start fresh from main.
            git checkout -B "$BRANCH" origin/main
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.conflict != 'true'
        env:
          RELAY_DATABASE_URL: postgres://agentrelay:agentrelay-dev@localhost:5433/agentrelay
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter relay exec node --import tsx/esm src/db/migrate.ts

      - name: Collect owner replies and open-issue snapshot
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The agent cannot call GitHub, so give it a read-only snapshot of the open
          # issues the owner wrote. Issues from anyone else are left out.
          gh issue list --state open --limit 100 --json number,title,labels,author,body \
            | jq -r --arg owner "$OWNER" '.[]
              | select(.author.login == $owner)
              | select([.labels[].name] | index("autopilot") | not)
              | "### #\(.number) \(.title)\n\nLabels: \([.labels[].name] | join(", "))\n\n\(.body[0:6000])\n"' \
            > "$AUTOPILOT_OUT/issues.md"
          echo "Issue snapshot: $(grep -c '^### #' "$AUTOPILOT_OUT/issues.md" || true) issues"
          # Only the owner's comments reach the agent. The repository is public.
          gh issue list --label "$NEEDS_YOU_LABEL" --state open --limit 30 \
            --json number,title,body,comments \
            | jq -r --arg owner "$OWNER" '.[] |
              "### Issue #\(.number): \(.title)\n\n\(.body)\n\n" +
              ([.comments[] | select(.author.login == $owner) |
                "**Owner reply (\(.createdAt)):**\n\n\(.body)\n"] | join("\n")) + "\n"' \
            > "$AUTOPILOT_OUT/inbox.md"

      - name: Run agent
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.conflict != 'true'
        continue-on-error: true
        env:
          AUTOPILOT_MODEL: ${{ inputs.model || 'gpt-6.1-sol' }}
          AUTOPILOT_FALLBACK_MODEL: FW-GLM-5.3
          AUTOPILOT_RUN_ID: ${{ github.run_id }}
        # No database variables here: they switch relay unit tests to parallel
        # database runs. PROMPT.md gives the agent the integration command with them.
        run: bash "$AUTOPILOT_HARNESS/run.sh"

      - name: Save memory and discard leftovers
        id: tidy
        if: steps.gate.outputs.status == 'running' && steps.branch.outputs.conflict != 'true'
        env:
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          # Unstage everything and drop merge or cherry-pick state, so only the memory
          # files can be committed here; the rest is discarded below.
          git merge --abort 2>/dev/null || true
          git cherry-pick --abort 2>/dev/null || true
          git reset -q
          if [[ -n "$(git status --porcelain -- autopilot/STATE.md autopilot/JOURNAL.md)" ]]; then
            git add autopilot/STATE.md autopilot/JOURNAL.md
            git commit -m "chore(autopilot): update run memory"
          fi
          leftovers="$(git status --porcelain)"
          if [[ -n "$leftovers" ]]; then
            { echo '### Discarded uncommitted changes'; echo '```'; echo "$leftovers" | head -n 50; echo '```'; } >> "$AUTOPILOT_OUT/notes.md"
            git reset -q --hard HEAD && git clean -fdq
          fi
          if [[ "$(git rev-parse HEAD)" != "$BASE" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify
        if: steps.tidy.outputs.changed == 'true'
        run: |
          # A quick pre-push signal. The PR's own CI is the merge gate.
          # Unit tests use the CONTRIBUTING.md command: `pnpm -r test` also runs the e2e
          # workspace, which needs a live relay. Only the integration command gets the
          # database variables, matching the CI unit and relay-integration jobs.
          : > "$AUTOPILOT_OUT/verify.md"
          for cmd in "pnpm lint" "pnpm -r typecheck" "pnpm -r build" \
            "pnpm --filter @agentrelay/protocol --filter relay --filter agentrelay-mcp --filter agentrelay-node test" \
            "env RELAY_TEST_DATABASE_URL=postgres://agentrelay:agentrelay-dev@localhost:5433/agentrelay RELAY_TEST_TRUNCATE_VIA_PSQL=1 pnpm --filter relay test:integration"; do
            if $cmd > "$AUTOPILOT_OUT/verify.log" 2>&1; then
              echo "- \`$cmd\`: pass" >> "$AUTOPILOT_OUT/verify.md"
            else
              cat "$AUTOPILOT_OUT/verify.log"
              {
                echo "- \`$cmd\`: **FAIL**"
                echo; echo '  <details><summary>Last 40 lines</summary>'; echo; echo '  ```'
                tail -n 40 "$AUTOPILOT_OUT/verify.log" | sed 's/^/  /'
                echo '  ```'; echo; echo '  </details>'
              } >> "$AUTOPILOT_OUT/verify.md"
            fi
          done

      - name: Bundle new commits
        id: bundle
        if: steps.tidy.outputs.changed == 'true'
        env:
          REMOTE: ${{ steps.branch.outputs.remote }}
        run: |
          # Everything already on the remote is excluded; publish verifies the rest.
          excludes=(origin/main)
          if [[ -n "$REMOTE" ]]; then excludes+=("$REMOTE"); fi
          git bundle create "$AUTOPILOT_OUT/branch.bundle" HEAD --not "${excludes[@]}"
          echo "bundle=true" >> "$GITHUB_OUTPUT"

      - name: Hand results to the publish job
        if: always() && steps.gate.outputs.status == 'running'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: autopilot-out
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/autopilot
            !${{ runner.temp }}/autopilot/codex-home

  publish:
    needs: agent
    if: always() && needs.agent.outputs.status == 'running'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    cache-mode: none
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MODE: ${{ needs.agent.outputs.mode }}
      BASE: ${{ needs.agent.outputs.base }}
      REMOTE: ${{ needs.agent.outputs.remote }}
      CONFLICT: ${{ needs.agent.outputs.conflict }}
      HAS_BUNDLE: ${{ needs.agent.outputs.bundle }}
      AGENT_RESULT: ${{ needs.agent.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    # Everything from the agent job is untrusted. This job runs no repository code.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: autopilot-out
          path: ${{ runner.temp }}/autopilot

      - name: Validate, rewrite, and push the agent's commits
        id: publish
        if: env.HAS_BUNDLE == 'true'
        run: |
          out="$RUNNER_TEMP/autopilot"
          mkdir -p "$out"
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          reject() {
            printf '### Not published\n\n%s\n\n' "$1" >> "$out/notes.md"
            echo "::error::$1"
            exit 0
          }
          open_pr() {
            gh pr list --head "$BRANCH" --base main --state open --json number,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository == false)][0].number // empty'
          }
          git fetch -q origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          current="$(git rev-parse -q --verify "origin/$BRANCH" || true)"

          git bundle verify -q "$out/branch.bundle" || reject "The commit bundle from the agent job did not verify."
          git fetch -q "$out/branch.bundle" "HEAD:refs/autopilot/candidate" || reject "The commit bundle could not be fetched."
          candidate="$(git rev-parse refs/autopilot/candidate)"

          # BASE was recorded before the agent ran: main's tip, or the open PR's head
          # with main merged in. The agent's commits must sit on top of it.
          git cat-file -e "$BASE^{commit}" 2>/dev/null || reject "The run's base commit is missing."
          git merge-base --is-ancestor "$BASE" "$candidate" || reject "The agent's commits do not build on the run's base commit."
          if [[ "$MODE" == continue ]]; then
            if [[ "$BASE" != "$REMOTE" ]] && ! git merge-base --is-ancestor "$BASE" origin/main; then
              read -r _ p1 p2 extra < <(git rev-list --parents -n1 "$BASE")
              if [[ -n "$extra" || "$p1" != "$REMOTE" || -z "$p2" ]] || ! git merge-base --is-ancestor "$p2" origin/main; then
                reject "The run's base is not a merge of main into the PR head."
              fi
            fi
          else
            git merge-base --is-ancestor "$BASE" origin/main || reject "The run's base is not on main."
          fi
          [[ -z "$(git rev-list --merges "$BASE..$candidate")" ]] || reject "The agent created merge commits."
          # Additions, edits, deletions, and moves under .github/ are all refused.
          git diff --quiet --no-renames "$BASE" "$candidate" -- .github \
            || reject "The agent changed files under .github/, which autopilot never publishes."

          # Closing the PR discards its work, including work that was running when it closed.
          if [[ "$MODE" == continue ]] && ! git merge-base --is-ancestor "$REMOTE" origin/main; then
            pr="$(open_pr)" || reject "Could not check whether the autopilot PR is still open; nothing was published."
            [[ -n "$pr" ]] || reject "The autopilot PR was closed during this run, so its work stays discarded. The next run starts fresh from main."
          fi
          if [[ "$MODE" == fresh ]]; then
            pr="$(open_pr)" || reject "Could not check for an open autopilot PR; nothing was published."
            [[ -z "$pr" ]] || reject "An autopilot PR (#$pr) opened during this run; this run's commits were not published over it."
          fi

          # Owner identity and no AI attribution on this run's commits only.
          git checkout -q -B "$BRANCH" "$candidate"
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --env-filter '
              export GIT_AUTHOR_NAME="$GIT_NAME" GIT_COMMITTER_NAME="$GIT_NAME"
              export GIT_AUTHOR_EMAIL="$GIT_EMAIL" GIT_COMMITTER_EMAIL="$GIT_EMAIL"' \
            --msg-filter 'grep -viE "^(co-authored-by:|.*generated (with|by) .*(claude|codex|gpt|openai|anthropic|ai))" || true' \
            "$BASE..HEAD" >/dev/null || reject "Rewriting commit identity failed; nothing was pushed."

          # If the branch moved during the run (for example a reply merge brought main
          # in), build on top of it instead of discarding either side.
          if [[ "$MODE" == continue && -n "$current" && "$current" != "$REMOTE" ]]; then
            git merge-base --is-ancestor "$REMOTE" "$current" \
              || reject "The autopilot branch was rewritten during the run; this run's commits were not published."
            git merge --no-edit "origin/$BRANCH" || { git merge --abort; reject "The autopilot branch moved during the run and merging it conflicts."; }
          fi

          git -c core.hooksPath=/dev/null push -q --force-with-lease="refs/heads/$BRANCH:$current" \
            "https://x-access-token:${GH_TOKEN}@github.com/$GH_REPO.git" "HEAD:refs/heads/$BRANCH" \
            || reject "Pushing to \`$BRANCH\` failed; it changed while this run was publishing. The commits are kept in the autopilot-out artifact of $RUN_URL for 7 days."
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Update the draft PR and approve its CI
        id: pr
        if: steps.publish.outputs.published == 'true'
        run: |
          out="$RUNNER_TEMP/autopilot"
          # The agent describes the whole branch in pr.md: a title line, then the body.
          default_title="chore(autopilot): scheduled autopilot work"
          title=""
          printf '## Summary\n\nWork from scheduled autopilot runs toward the goal in `autopilot/GOALS.md`. Per-run detail is in `autopilot/JOURNAL.md`.\n' \
            > "$out/pr-body.md"
          if [[ -s "$out/pr.md" ]]; then
            title="$(head -n1 "$out/pr.md" | sed -E 's/^#+ *//; s/^[[:space:]]+//; s/[[:space:]]+$//' | cut -c1-120)"
            tail -n +2 "$out/pr.md" | head -c 60000 \
              | grep -viE '^(co-authored-by:|.*generated (with|by) .*(claude|codex|gpt|openai|anthropic|ai))' \
              > "$out/pr-body.md" || true
            [[ -s "$out/pr-body.md" ]] || printf '## Summary\n\nSee `autopilot/JOURNAL.md`.\n' > "$out/pr-body.md"
          fi
          pr="$(gh pr list --head "$BRANCH" --base main --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')"
          if [[ -z "$pr" ]]; then
            gh pr create --draft --base main --head "$BRANCH" --title "${title:-$default_title}" --body-file "$out/pr-body.md"
          elif [[ -n "$title" ]]; then
            gh pr edit "$pr" --title "$title" --body-file "$out/pr-body.md"
          fi

          # CI on a PR opened by github-actions waits for approval, and main only counts
          # checks from the PR's own CI. Approve only this branch's pending CI runs, so a
          # fork PR pointed at the same commit is never approved along with it.
          head="$(git rev-parse HEAD)"
          ids=""
          for _ in $(seq 1 24); do
            ids="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$head&status=action_required&event=pull_request" \
              --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .head_repository.full_name == env.GH_REPO and .head_branch == env.BRANCH) | .id' \
              || true)"
            [[ -n "$ids" ]] && break
            sleep 5
          done
          if [[ -z "$ids" ]]; then
            printf '### CI not approved\n\nNo pending CI run appeared for %s; a `merge` reply approves it later.\n\n' "${head:0:7}" >> "$out/notes.md"
          fi
          for id in $ids; do
            if gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null; then
              echo "Approved pending CI run $id"
            else
              printf '### CI not approved\n\nCould not approve CI run %s; a `merge` reply retries.\n\n' "$id" >> "$out/notes.md"
            fi
          done

      - name: Open owner questions, close resolved ones, post run report
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
        run: |
          gh label create "$NEEDS_YOU_LABEL" --color B60205 --description "Autopilot is waiting on the owner" --force || true
          gh label create autopilot --color 5319E7 --description "Autopilot runs" --force || true
          out="$RUNNER_TEMP/autopilot"
          mkdir -p "$out/questions"
          # Agent-written text is shown as-is but cannot impersonate the head-commit line
          # the merge workflow reads, and is size-bounded.
          agent_text() { head -c "$2" "$1" | sed -E 's/[Hh][Ee][Aa][Dd][[:space:]]*[Cc][Oo][Mm][Mm][Ii][Tt]/head-commit/g'; }

          opened=""
          if [[ "$CONFLICT" == "true" ]]; then
            conflict_title="Autopilot: Merging main into the autopilot branch conflicts"
            existing="$(gh issue list --label "$NEEDS_YOU_LABEL" --state open --limit 100 --json number,title,url \
              | jq -r --arg t "$conflict_title" 'map(select(.title == $t)) | .[0] // empty | "\(.number) \(.url)"' || true)"
            if [[ -n "$existing" ]]; then
              read -r n url <<<"$existing"
              gh issue comment "$n" --body "Still conflicting with main as of $RUN_URL. Runs are skipped until it is resolved." || true
              opened+="- $url (still open)"$'\n'
            else
              printf '%s\n\n%s\n' "Merging main into the autopilot branch conflicts" \
                "The open autopilot PR conflicts with main. Resolve the conflicts on the \`$BRANCH\` branch, or close the PR to discard it. Runs are skipped until then." \
                > "$out/questions/merge-conflict.md"
            fi
          fi

          for q in "$out"/questions/*.md; do
            [[ -f "$q" ]] || continue
            title="$(head -n1 "$q" | sed 's/^#* *//' | cut -c1-100)"
            [[ -n "$title" ]] || title="Question from the autopilot"
            body="$(printf '@%s\n\n%s\n\n---\nReply here. A reply from @%s starts a run immediately; comments from anyone else are ignored. Run: %s\n' \
              "$OWNER" "$(tail -n +2 "$q" | agent_text /dev/stdin 20000)" "$OWNER" "$RUN_URL")"
            if url="$(gh issue create --label "$NEEDS_YOU_LABEL" --label autopilot --title "Autopilot: $title" --body "$body")"; then
              opened+="- $url"$'\n'
            else
              echo "::warning::Could not open question $(basename "$q")"
            fi
          done

          if [[ -s "$out/resolved.txt" ]]; then
            sed -nE 's/^#?([0-9]+).*/\1/p' "$out/resolved.txt" | sort -u | while read -r n; do
              if gh issue view "$n" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx "$NEEDS_YOU_LABEL"; then
                gh issue close "$n" --comment "Resolved in autopilot run $RUN_URL" || echo "::warning::Could not close #$n"
              fi
            done
          fi

          pr_json="$(gh pr list --head "$BRANCH" --base main --state open --json number,url,headRefOid,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false)][0] // empty' || true)"
          {
            echo "@$OWNER autopilot run finished: $RUN_URL"
            echo
            if [[ "$AGENT_RESULT" != "success" ]]; then
              echo "**The agent job ended with: $AGENT_RESULT.** See the run for details."
              echo
            fi
            if [[ "$HAS_BUNDLE" == "true" && "$PUBLISHED" != "true" ]] && ! grep -q '^### Not published' "$out/notes.md" 2>/dev/null; then
              echo "**Not published.** The publish step ended with: $PUBLISH_OUTCOME. This run's commits are only in the autopilot-out artifact of the run (kept 7 days)."
              echo
            fi
            if [[ "$PUBLISHED" == "true" && "$PR_OUTCOME" != "success" ]]; then
              echo "**The commits were pushed, but updating the PR ended with: $PR_OUTCOME.**"
              echo
            fi
            echo "**Sessions**"; echo '```'; agent_text "$out/sessions.log" 4000 2>/dev/null || echo "none"; echo '```'
            if [[ "$PUBLISHED" == "true" ]]; then
              echo "**Commits pushed**"; echo '```'; git log --oneline --no-merges "$BASE..HEAD" | head -n 50 || true; echo '```'
            fi
            [[ -s "$out/verify.md" ]] && { echo "**Agent job checks**"; agent_text "$out/verify.md" 8000; echo; }
            [[ -n "$opened" ]] && { echo "**Questions for you**"; echo "$opened"; }
            [[ -s "$out/summary.md" ]] && { echo "**Agent summary**"; agent_text "$out/summary.md" 20000; echo; }
            [[ -s "$out/notes.md" ]] && agent_text "$out/notes.md" 15000
            if [[ -n "$pr_json" ]]; then
              pr_url="$(jq -r .url <<<"$pr_json")"
              pr_head="$(jq -r .headRefOid <<<"$pr_json")"
              git fetch -q origin "$pr_head" 2>/dev/null || true
              echo
              echo "**Files changed vs main** (from git, not the agent)"
              echo '```'; git diff --stat "origin/main...$pr_head" 2>/dev/null | tail -n 40 || true; echo '```'
              echo "**Review:** $pr_url"
              echo
              # Must stay the last head-commit line: autopilot-merge.yml binds a reply to it.
              echo "Head commit: \`$pr_head\`"
              echo
              echo "Reply \`merge\` to this email to merge exactly that commit into main once its checks pass."
            fi
            true
          } > "$out/report.md"

          log_issue="$(gh issue list --label autopilot --state open --json number,title \
            | jq -r --arg t "$LOG_ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          if [[ -z "$log_issue" ]]; then
            log_issue="$(gh issue create --label autopilot --title "$LOG_ISSUE_TITLE" \
              --body "One comment per autopilot run. Reply \`merge\` to a run's email to merge its PR. Pause runs by setting \`status: paused\` in \`autopilot/GOALS.md\` on main.")"
          fi
          gh issue comment "$log_issue" --body-file "$out/report.md"
