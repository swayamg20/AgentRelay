# Auto-deploy the AgentRelay relay to Fly.io on version tag push.
#
# Trigger: pushing a SemVer tag like `v0.2.0` or `v1.0.0`. Day-to-day
# pushes to `main` do NOT deploy — tag a release explicitly.
#
# Setup (one-time, post-`fly launch`):
#   1. Run `fly auth token` locally to mint a deploy token.
#   2. On GitHub: Settings → Secrets and variables → Actions →
#      New repository secret → name `FLY_API_TOKEN`, paste the token.
#   3. Push a tag: `git tag v0.2.0 && git push origin v0.2.0`.
#
# See docs/deploy-fly.md for the full walkthrough.

name: deploy-fly

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy relay to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-fly-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install verified flyctl
        env:
          FLYCTL_VERSION: 0.4.80
          FLYCTL_ARCHIVE_SHA256: 6444747d922f1763152d665d378c98bb21aa9b0aa773c4318a9a2c10b2ff54da
        run: |
          archive="$RUNNER_TEMP/flyctl.tar.gz"
          install_dir="$RUNNER_TEMP/flyctl-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/superfly/flyctl/releases/download/v${FLYCTL_VERSION}/flyctl_${FLYCTL_VERSION}_Linux_x86_64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$FLYCTL_ARCHIVE_SHA256" "$archive" | sha256sum --check
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" flyctl
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
