name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Validate Azure deployment assets
        env:
          AGENTRELAY_AZURE_NAME_PREFIX: agentrelay
          AGENTRELAY_AZURE_RESOURCE_SUFFIX: '0123abcd'
          AGENTRELAY_AZURE_LOCATION: centralindia
          AGENTRELAY_AZURE_RELAY_IMAGE: ghcr.io/swayamg20/agentrelay-relay@sha256:7bd29bee61450f18437c6ffb5b0e44990ebed1c46d718226184a695909c089ba
          AGENTRELAY_AZURE_POSTGRES_LOGIN: agentrelay_admin
          AGENTRELAY_AZURE_DEPLOYER_PRINCIPAL_ID: '00000000-0000-0000-0000-000000000000'
          AGENTRELAY_AZURE_POSTGRES_PASSWORD: '0123456789abcdef0123456789abcdef0123456789abcdef'
          AGENTRELAY_AZURE_RELAY_PEPPER: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          AGENTRELAY_AZURE_RELAY_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          AGENTRELAY_AZURE_RELAY_INVITE_SECRET: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          AGENTRELAY_AZURE_RELAY_ADMIN_TOKEN: '0123456789abcdef0123456789abcdef0123456789abcdef'
          AGENTRELAY_AZURE_RELAY_METRICS_TOKEN: '0123456789abcdef0123456789abcdef'
        run: |
          bicep="$RUNNER_TEMP/bicep"
          curl --fail --silent --show-error --location \
            https://github.com/Azure/bicep/releases/download/v0.46.1/bicep-linux-x64 \
            --output "$bicep"
          printf '%s  %s\n' \
            3e011d629ea4311b7a7dd8f0040ab2b1a072ea4ff5d02cb75e0e55a9a6703fb9 \
            "$bicep" | sha256sum --check
          chmod +x "$bicep"
          bash -n infra/azure/deploy.sh infra/azure/smoke.sh
          "$bicep" build infra/azure/main.bicep --stdout >/dev/null
          "$bicep" build-params infra/azure/main.bicepparam --stdout >/dev/null

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm -r typecheck

      - run: pnpm -r build

      - run: pnpm --filter @agentrelay/protocol test:exports

      - name: Pack and smoke-test agentrelay-mcp
        run: |
          pack_dir="$RUNNER_TEMP/agentrelay-mcp-pack"
          package_version=$(node -p "require('./mcp-server/package.json').version")
          mkdir -p "$pack_dir"
          pnpm --dir mcp-server pack --pack-destination "$pack_dir"
          node mcp-server/scripts/smoke-packed-artifact.mjs \
            "$pack_dir/agentrelay-mcp-$package_version.tgz"

  unit:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The MCP CLI tests exercise compiled bins and intentionally skip when
      # dist is absent. Build it in both supported Node lanes before unit tests.
      - run: pnpm --filter agentrelay-mcp build

      # Skip the e2e workspace — it needs Postgres + builds + a real
      # relay subprocess and is covered by the dedicated `e2e` job.
      - run: >-
          pnpm --filter @agentrelay/protocol --filter relay --filter agentrelay-mcp
          --filter agentrelay-node test

  node-process-macos:
    name: node-process-macos (${{ matrix.node }})
    needs: lint-typecheck
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @agentrelay/protocol build

      - name: Exercise native Node and guardian ownership
        run: >-
          pnpm --filter agentrelay-node exec vitest run
          src/process-lock.test.ts src/process-lock.process.test.ts
          src/codex-provider-guardian.process.test.ts

  containment-linux:
    name: containment-linux
    needs: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Ubuntu 24.04 gates unprivileged user namespaces behind AppArmor. This
      # disposable proof host must expose the namespace primitive that the
      # production boundary probes and otherwise fails closed on.
      - name: Enable the Linux namespace prerequisite
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # The containment scanner deliberately rejects package trees that are
      # hard-linked back into pnpm's content-addressed store.
      - run: pnpm install --frozen-lockfile --package-import-method=copy

      - run: pnpm --filter @agentrelay/protocol build

      - name: Prove Linux containment and guardian owner death
        env:
          AGENTRELAY_RUN_CONTAINMENT_TESTS: '1'
        run: >-
          pnpm --filter agentrelay-node exec vitest run
          src/runtime-containment.process.test.ts src/codex-provider-guardian.process.test.ts

  relay-image:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build relay image
        run: docker build --tag agentrelay-relay:ci --file relay/Dockerfile .

      - name: Smoke-test protocol workspace dependency
        run: >-
          docker run --rm
          --entrypoint node
          --workdir /app/relay
          agentrelay-relay:ci
          --input-type=module
          --eval "await import('@agentrelay/protocol')"

  relay-integration:
    needs: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentrelay
          POSTGRES_PASSWORD: agentrelay-dev
          POSTGRES_DB: agentrelay
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agentrelay -d agentrelay"
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: pnpm install --frozen-lockfile

      # Apply migrations against the fresh Postgres service container
      # before the per-file integration loop. The loop's TRUNCATE step
      # assumes the schema exists; on a clean DB the first truncate
      # would fail with `relation "agents" does not exist`. Drizzle
      # migrate is idempotent.
      - run: pnpm --filter relay exec node --import tsx/esm src/db/migrate.ts
        env:
          RELAY_DATABASE_URL: postgres://agentrelay:agentrelay-dev@localhost:5433/agentrelay

      - run: pnpm --filter relay test:integration
        env:
          RELAY_TEST_DATABASE_URL: postgres://agentrelay:agentrelay-dev@localhost:5433/agentrelay
          RELAY_TEST_TRUNCATE_VIA_PSQL: '1'

  e2e:
    needs: [unit, relay-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentrelay
          POSTGRES_PASSWORD: agentrelay-dev
          POSTGRES_DB: agentrelay
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agentrelay -d agentrelay"
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Apply migrations once before the e2e tests — TestRelay.boot()
      # spawns the relay against this DB and the harness expects the
      # schema to exist. Drizzle migrate is idempotent.
      - run: pnpm --filter relay exec node --import tsx/esm src/db/migrate.ts
        env:
          RELAY_DATABASE_URL: postgres://agentrelay:agentrelay-dev@localhost:5433/agentrelay

      - run: pnpm --filter agentrelay-e2e test
        env:
          RELAY_TEST_DATABASE_URL: postgres://agentrelay:agentrelay-dev@localhost:5433/agentrelay
