name: Autopilot reply

# The owner's reply on an open autopilot question starts an autopilot run instead of
# waiting for the schedule. Kept separate from autopilot.yml so comment events, which
# anyone can create on this public repository, never enter its concurrency group.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  start-run:
    if: >-
      github.event.comment.user.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'autopilot:needs-you')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    cache-mode: none
    permissions:
      actions: write
      issues: write
    steps:
      - name: Dispatch an autopilot run and acknowledge the reply
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh workflow run autopilot.yml --ref main
          # A thumbs-up on the owner's comment shows the reply was picked up.
          gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content='+1' >/dev/null \
            || echo "::warning::Could not react to the comment"
