# Codex CLI configuration for the autopilot workflow. `autopilot/run.sh` copies this
# into a throwaway CODEX_HOME and supplies the endpoint with
# `-c model_providers.azure.base_url=...` from the AZURE_FOUNDRY_BASE_URL variable.
model_provider = "azure"
model = "gpt-6.1-sol"

[model_providers.azure]
name = "Azure AI Foundry"
env_key = "AZURE_FOUNDRY_API_KEY"
wire_api = "responses"

# Commands the agent runs never see the model key or any GitHub credentials.
[shell_environment_policy]
inherit = "all"
exclude = ["AZURE_*", "GH_*", "GITHUB_TOKEN", "ACTIONS_*"]
